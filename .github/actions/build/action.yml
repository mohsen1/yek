name: Build
description: Build yek across different platforms

inputs:
  target:
    required: true
    description: "The target triple to build for"

outputs:
  binary_path:
    description: "Path to the built binary"
    value: ${{ steps.get_binary_path.outputs.path }}

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        target: ${{ inputs.target }}

    # cross builds every Linux target in a container with that target's C
    # toolchain, which the vendored OpenSSL and libgit2 need.
    - name: Build with cross (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cargo install cross --locked
        cross build --release --locked --target ${{ inputs.target }}

    - name: Build natively (macOS/Windows)
      if: runner.os != 'Linux'
      shell: bash
      run: cargo build --release --locked --target ${{ inputs.target }}

    - name: Final path
      id: get_binary_path
      shell: bash
      run: |
        binary=yek
        [ "${{ runner.os }}" = "Windows" ] && binary=yek.exe
        echo "path=target/${{ inputs.target }}/release/$binary" >> "$GITHUB_OUTPUT"
